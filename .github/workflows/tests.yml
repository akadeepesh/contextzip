name: Tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # The mcp extra (contextzip mcp) only installs on Python 3.10+.
        run: python -m pip install -e ".[mcp]"

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@contextzip.test"
          git config --global user.name "contextzip CI"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  pyodide:
    # contextzipcli.com runs contextzip in the browser through Pyodide;
    # this proves the real wheel packages and applies there.
    name: Pyodide (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pyodide/package-lock.json

      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist/wheel

      - name: Package and apply inside Pyodide
        working-directory: pyodide
        run: |
          npm ci
          node smoke.mjs ../dist/wheel/contextzip-*.whl
