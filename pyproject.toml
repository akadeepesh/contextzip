[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextzip"
version = "0.1.0"
description = "Intelligently package your codebase for AI tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pathspec>=0.12",
]

[project.scripts]
contextzip = "contextzip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextzip*"]
