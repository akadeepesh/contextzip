name: Publish VS Code extension

# Push a tag vscode-vX.Y.Z (matching vscode/package.json) to publish the
# extension. Every run also attaches the .vsix files (one per platform, plus a
# universal one) to a GitHub release for that tag, for uploading to the
# VS Code Marketplace by hand when there's no VSCE_PAT. It bundles the contextzip CLI named in package.json's
# "contextzip.cliVersion", taken from that CLI release's assets, so publish
# the CLI release first.
#
# Secrets (a missing one skips that store):
#   VSCE_PAT   Azure DevOps token for the VS Code Marketplace publisher "contextzip"
#   OVSX_PAT   Open VSX token for the "contextzip" namespace (Cursor, Windsurf, VSCodium)

on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: write # the GitHub release with the .vsix files

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Check the tag matches the extension version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#vscode-v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match vscode/package.json version $VERSION"; exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Download the bundled CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLI=$(node -p "require('./package.json').contextzip.cliVersion")
          gh release download "v$CLI" --repo "${{ github.repository }}" --pattern "contextzip-$CLI-*.tar.gz" --dir ../dist/release

      - name: Package
        run: node scripts/package.mjs --artifacts ../dist/release --out ../dist/vscode

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT isn't set — skipping the Marketplace"; exit 0; fi
          npx vsce publish --packagePath ../dist/vscode/*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT isn't set — skipping Open VSX"; exit 0; fi
          for f in ../dist/vscode/*.vsix; do npx ovsx publish "$f" -p "$OVSX_PAT"; done

      - name: Attach the .vsix files to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # This version's section of vscode/CHANGELOG.md, then how to upload.
          node -e '
            const [v] = process.argv.slice(1);
            const part = require("fs").readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find((p) => p.startsWith(`[${v}]`));
            console.log(part ? part.split("\n").slice(1).join("\n").trim() : "");
          ' "$VERSION" > ../dist/vsix-notes.md
          cat >> ../dist/vsix-notes.md <<EOF

          ### Uploading to the VS Code Marketplace

          On marketplace.visualstudio.com/manage, upload contextzip-win32-x64-$VERSION.vsix (New extension, or … → Update
          on the extension), then each other platform's file the same way, and contextzip-$VERSION.vsix (the universal
          fallback) last.
          EOF
          # Never "Latest": that stays the CLI's release.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "contextzip for VS Code $VERSION" --notes-file ../dist/vsix-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" ../dist/vscode/*.vsix --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: dist/vscode/*.vsix
